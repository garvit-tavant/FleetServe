<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Reason</mat-label>
    <textarea
      matInput
      [(ngModel)]="reason"
      name="reason"
      rows="3"
      maxlength="500"
      placeholder="Enter reason (max 500 characters)"
    ></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!reason.trim()" (click)="confirm()">
    {{ data.actionLabel }}
  </button>
</mat-dialog-actions>
