<div class="asset-class-form-container">
  <h1>Add Asset Class</h1>

  @if (errorMessage()) {
    <p class="asset-class-form-error">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="asset-class-form">
    <mat-form-field appearance="outline">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" />
      @if (form.get('code')?.hasError('required') && form.get('code')?.touched) {
        <mat-error>Code is required.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" />
      @if (form.get('description')?.hasError('required') && form.get('description')?.touched) {
        <mat-error>Description is required.</mat-error>
      }
    </mat-form-field>

    <div class="asset-class-form-actions">
      <button mat-button type="button" routerLink="/asset-classes">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Create Asset Class
        }
      </button>
    </div>
  </form>
</div>
