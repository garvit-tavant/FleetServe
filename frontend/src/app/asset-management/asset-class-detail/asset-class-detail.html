<div class="asset-class-detail-container">
  @if (loading()) {
    <div class="asset-class-detail-spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (errorMessage()) {
    <p class="asset-class-detail-error">{{ errorMessage() }}</p>
  } @else if (assetClass(); as ac) {
    <mat-card class="asset-class-detail-card">
      <mat-card-header>
        <mat-card-title>{{ ac.code }}</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div class="asset-class-detail-field">
          <span class="label">Description:</span>
          <span>{{ ac.description }}</span>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button routerLink="/asset-classes">Back to List</button>
      </mat-card-actions>
    </mat-card>
  }
</div>
